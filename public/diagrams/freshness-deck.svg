<line x1="925" y1="102" x2="925" y2="216" stroke="#e9e7df" marker-end="url(#freshness-arrow-fg)"/>
<line x1="858" y1="240" x2="734" y2="240" stroke="#e9e7df" marker-end="url(#freshness-arrow-fg)"/>
<line x1="905" y1="218" x2="905" y2="104" stroke="#e9e7df" stroke-dasharray="3 3" marker-end="url(#freshness-arrow-fg)"/>
<line x1="992" y1="80" x2="1110" y2="80" stroke="#ff7a4d" stroke-width="1.5" marker-end="url(#freshness-arrow-accent)"/>
<path d="M 665 218 L 665 130 L 856 90" fill="none" stroke="#e9e7df" stroke-dasharray="3 3" marker-end="url(#freshness-arrow-fg)"/>

<line x1="796" y1="248" x2="796" y2="262" stroke="rgba(26,28,32,0.22)"/>
<line x1="796" y1="262" x2="870" y2="262" stroke="rgba(26,28,32,0.22)"/>
<line x1="870" y1="262" x2="870" y2="278" stroke="rgba(26,28,32,0.22)"/>
<rect x="472" y="12" width="176" height="46" fill="none" stroke="#6b6457" stroke-dasharray="4 4"/>
<rect x="0" y="140" width="176" height="64" fill="rgba(26,28,32,0.05)" stroke="rgba(26,28,32,0.22)"/>
<rect x="236" y="140" width="176" height="64" fill="rgba(26,28,32,0.05)" stroke="rgba(26,28,32,0.22)"/>
<rect x="472" y="140" width="176" height="64" fill="rgba(26,28,32,0.05)" stroke="rgba(26,28,32,0.22)"/>
<rect x="708" y="140" width="176" height="64" fill="rgba(26,28,32,0.05)" stroke="rgba(26,28,32,0.22)"/>
<rect x="944" y="140" width="176" height="64" fill="rgba(26,28,32,0.05)" stroke="rgba(26,28,32,0.22)"/>
<rect x="330" y="278" width="220" height="66" fill="rgba(26,28,32,0.05)" stroke="#b0451d" stroke-width="1.5"/>
<rect x="570" y="278" width="160" height="66" fill="rgba(26,28,32,0.05)" stroke="rgba(26,28,32,0.22)"/>
<rect x="750" y="278" width="240" height="66" fill="rgba(26,28,32,0.05)" stroke="rgba(26,28,32,0.22)"/>
<text x="560" y="31" font-size="11" fill="#6b6457" text-anchor="middle" font-weight="700">bridge-db · personal-ops</text>
<text x="560" y="47" font-size="10" fill="#6b6457" text-anchor="middle">the real stores</text>
<text x="576" y="111" font-size="10" fill="#6b6457">no import · no fetch · no MCP</text>
<text x="88" y="168" font-size="12" fill="#1a1c20" text-anchor="middle" font-weight="700">src/data/vocab.ts</text>
<text x="88" y="186" font-size="10" fill="#6b6457" text-anchor="middle">closed vocabularies</text>
<text x="88" y="224" font-size="9.5" fill="#6b6457" text-anchor="middle">24 codenames · 8 task classes</text>
<text x="88" y="238" font-size="9.5" fill="#6b6457" text-anchor="middle">7 guard layers · 6 rules</text>
<text x="324" y="168" font-size="12" fill="#1a1c20" text-anchor="middle" font-weight="700">src/data/generate.ts</text>
<text x="324" y="186" font-size="10" fill="#6b6457" text-anchor="middle">pure: seed -&gt; data</text>
<text x="324" y="224" font-size="9.5" fill="#6b6457" text-anchor="middle">SEED 0x0fe7a123 · mulberry32</text>
<text x="324" y="238" font-size="9.5" fill="#6b6457" text-anchor="middle">no Date.now, no Math.random</text>
<text x="560" y="168" font-size="12" fill="#1a1c20" text-anchor="middle" font-weight="700">src/data/dataset.json</text>
<text x="560" y="186" font-size="10" fill="#6b6457" text-anchor="middle">committed artifact</text>
<text x="560" y="224" font-size="9.5" fill="#6b6457" text-anchor="middle">46 events · 8 activity · 2 handoffs</text>
<text x="560" y="238" font-size="9.5" fill="#6b6457" text-anchor="middle">the app's only data import</text>
<text x="796" y="168" font-size="12" fill="#1a1c20" text-anchor="middle" font-weight="700">pnpm build</text>
<text x="796" y="186" font-size="10" fill="#6b6457" text-anchor="middle">vite · sourcemap: false</text>
<text x="796" y="224" font-size="9.5" fill="#6b6457" text-anchor="middle">no build-machine paths</text>
<text x="796" y="238" font-size="9.5" fill="#6b6457" text-anchor="middle">in the shipped bundle</text>
<text x="1032" y="168" font-size="12" fill="#1a1c20" text-anchor="middle" font-weight="700">release lineage</text>
<text x="1032" y="186" font-size="10" fill="#6b6457" text-anchor="middle">orphan root · neutral author</text>
<text x="1032" y="224" font-size="9.5" fill="#6b6457" text-anchor="middle">no merge base with dev, ever</text>
<text x="1032" y="238" font-size="9.5" fill="#6b6457" text-anchor="middle">log -p scanned, not just tree</text>
<text x="206" y="118" font-size="10" fill="#6b6457" text-anchor="middle">may only</text>
<text x="206" y="130" font-size="10" fill="#6b6457" text-anchor="middle">emit members</text>
<text x="442" y="118" font-size="10" fill="#6b6457" text-anchor="middle">written once,</text>
<text x="442" y="130" font-size="10" fill="#6b6457" text-anchor="middle">at authoring</text>
<text x="678" y="130" font-size="10" fill="#6b6457" text-anchor="middle">bundled</text>
<text x="914" y="118" font-size="10" fill="#6b6457" text-anchor="middle">tree copied,</text>
<text x="914" y="130" font-size="10" fill="#6b6457" text-anchor="middle">never merged</text>
<text x="440" y="298" font-size="11.5" fill="#b0451d" text-anchor="middle" font-weight="700">closure.test.ts</text>
<text x="440" y="314" font-size="10" fill="#6b6457" text-anchor="middle">every value in its allowlist</text>
<text x="440" y="327" font-size="10" fill="#6b6457" text-anchor="middle">cost deltas sum to session cost</text>
<text x="440" y="340" font-size="10" fill="#6b6457" text-anchor="middle">byte-identical · plants must fail</text>
<text x="650" y="298" font-size="11.5" fill="#1a1c20" text-anchor="middle" font-weight="700">property.test.ts</text>
<text x="650" y="314" font-size="10" fill="#6b6457" text-anchor="middle">closure holds across</text>
<text x="650" y="327" font-size="10" fill="#6b6457" text-anchor="middle">sampled seeds</text>
<text x="870" y="298" font-size="11.5" fill="#1a1c20" text-anchor="middle" font-weight="700">scripts/guard-scan.ts</text>
<text x="870" y="314" font-size="10" fill="#6b6457" text-anchor="middle">source + dataset + dist</text>
<text x="870" y="327" font-size="10" fill="#6b6457" text-anchor="middle">self-test: planted violations first</text>
<text x="870" y="340" font-size="10" fill="#6b6457" text-anchor="middle">forbidden names stored as hashes</text>
<text x="0" y="300" font-size="10" fill="#6b6457">GATES · any one failing fails the build</text>
<text x="0" y="314" font-size="10" fill="#6b6457">the load-bearing gate is closure,</text>
<text x="0" y="328" font-size="10" fill="#6b6457">not the scanner</text>
</svg>

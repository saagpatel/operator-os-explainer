<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" width="1120" height="350" role="img" aria-label="Closed vocabularies feed a pure seeded generator that writes one committed dataset; the app imports only that file, three gates fail the build on any escape, the bundle ships without source maps, and the release lineage is an orphan tree. The real stores have no wire into the app." font-family="Space Mono, ui-monospace, monospace">
<defs>
<marker id="closure-arrow-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1c20"/></marker>
</defs>
<rect width="1120" height="350" fill="#f4efe4"/>
<line x1="560" y1="58" x2="560" y2="92" stroke="#6b6457" stroke-dasharray="3 4"/>
<line x1="553" y1="100" x2="567" y2="114" stroke="#6b6457" stroke-width="1.5"/>

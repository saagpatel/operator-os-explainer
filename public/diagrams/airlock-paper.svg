<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" width="1120" height="350" role="img" aria-label="Three lanes, agent, hub, operator, and a boundary marked outside the machine. The agent creates a draft and raises an approval. Only the operator mints the one-use confirmation token and opens the timed send window. The send gate opens to the outside only when both hold. The agent lane never reaches the boundary." font-family="Space Mono, ui-monospace, monospace">
<defs>
<marker id="airlock-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0451d"/></marker>
<marker id="airlock-arrow-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1c20"/></marker>
</defs>
<rect width="1120" height="350" fill="#f4efe4"/>
<line x1="1000" y1="50" x2="1000" y2="330" stroke="#1a1c20" stroke-width="2"/>
<line x1="120" y1="80" x2="476" y2="80" stroke="rgba(26,28,32,0.22)"/>
<line x1="476" y1="80" x2="996" y2="80" stroke="rgba(26,28,32,0.22)" stroke-dasharray="2 5"/>
<line x1="120" y1="190" x2="996" y2="190" stroke="#1a1c20" stroke-width="2"/>
<line x1="120" y1="300" x2="996" y2="300" stroke="rgba(26,28,32,0.22)"/>
<line x1="260" y1="86" x2="260" y2="176" stroke="#1a1c20" marker-end="url(#airlock-arrow-fg)"/>
<line x1="470" y1="86" x2="470" y2="176" stroke="#1a1c20" marker-end="url(#airlock-arrow-fg)"/>
<line x1="620" y1="294" x2="620" y2="204" stroke="#b0451d" marker-end="url(#airlock-arrow-accent)"/>
<line x1="760" y1="294" x2="760" y2="204" stroke="#1a1c20" marker-end="url(#airlock-arrow-fg)"/>
<line x1="846" y1="170" x2="846" y2="210" stroke="#1a1c20" stroke-width="2"/>
<line x1="856" y1="170" x2="856" y2="210" stroke="#1a1c20" stroke-width="2"/>
<line x1="860" y1="190" x2="994" y2="190" stroke="#1a1c20" marker-end="url(#airlock-arrow-fg)"/>
<rect x="228" y="180" width="64" height="20" fill="#f4efe4" stroke="#1a1c20"/>
<rect x="426" y="180" width="88" height="20" fill="#f4efe4" stroke="#1a1c20"/>
<rect x="572" y="180" width="96" height="20" fill="#f4efe4" stroke="#b0451d"/>
<rect x="712" y="180" width="96" height="20" fill="#f4efe4" stroke="#1a1c20"/>
<circle cx="260" cy="80" r="4" fill="#1a1c20"/>
<circle cx="470" cy="80" r="4" fill="#1a1c20"/>
<circle cx="620" cy="300" r="4" fill="#b0451d"/>
<circle cx="760" cy="300" r="4" fill="#1a1c20"/>
<text x="260" y="24" font-size="10" fill="#6b6457" text-anchor="middle">T+40.0 s</text>
<text x="260" y="40" font-size="11" fill="#1a1c20" text-anchor="middle" font-weight="700">draft</text>
<text x="470" y="24" font-size="10" fill="#6b6457" text-anchor="middle">T+42.0 s</text>
<text x="470" y="40" font-size="11" fill="#1a1c20" text-anchor="middle" font-weight="700">approval</text>
<text x="850" y="24" font-size="10" fill="#6b6457" text-anchor="middle">T+44.0 s</text>
<text x="850" y="40" font-size="11" fill="#1a1c20" text-anchor="middle" font-weight="700">send</text>
<text x="1012" y="70" font-size="10" fill="#6b6457">OUTSIDE</text>
<text x="1012" y="84" font-size="10" fill="#6b6457">THE MACHINE</text>
<text x="0" y="78" font-size="11" fill="#1a1c20" font-weight="700">AGENT</text>
<text x="0" y="92" font-size="10" fill="#6b6457">prepares everything</text>
<text x="0" y="188" font-size="11" fill="#1a1c20" font-weight="700">HUB</text>
<text x="0" y="202" font-size="10" fill="#6b6457">approval queue · durable</text>
<text x="0" y="298" font-size="11" fill="#1a1c20" font-weight="700">OPERATOR</text>
<text x="0" y="312" font-size="10" fill="#6b6457">releases, or does not</text>
<text x="268" y="122" font-size="10" fill="#6b6457">create draft</text>
<text x="268" y="136" font-size="10" fill="#6b6457">draft artifact draft-71</text>
<text x="260" y="194" font-size="10" fill="#1a1c20" text-anchor="middle">draft</text>
<text x="478" y="122" font-size="10" fill="#6b6457">raise approval</text>
<text x="478" y="136" font-size="10" fill="#6b6457">raised for review</text>
<text x="470" y="194" font-size="10" fill="#1a1c20" text-anchor="middle">pending</text>
<text x="740" y="70" font-size="10" fill="#6b6457" text-anchor="middle">agent prepares everything, releases nothing</text>
<text x="628" y="244" font-size="10" fill="#b0451d">mints a one-use</text>
<text x="628" y="258" font-size="10" fill="#b0451d">confirmation token</text>
<text x="620" y="194" font-size="10" fill="#b0451d" text-anchor="middle">token accepted</text>
<text x="768" y="244" font-size="10" fill="#6b6457">opens the timed</text>
<text x="768" y="258" font-size="10" fill="#6b6457">send window</text>
<text x="760" y="194" font-size="10" fill="#1a1c20" text-anchor="middle">window open</text>
<text x="850" y="150" font-size="10" fill="#6b6457" text-anchor="middle">opens only if</text>
<text x="850" y="164" font-size="10" fill="#6b6457" text-anchor="middle">token AND window</text>
<text x="1012" y="194" font-size="10" fill="#1a1c20">sent</text>
<text x="120" y="334" font-size="10" fill="#6b6457">read-only views (status, inbox, worklist)</text>
<text x="120" y="348" font-size="10" fill="#6b6457">cross no boundary and need no token</text>
</svg>

<text x="980" y="204" font-size="10" fill="#e9e7df" text-anchor="middle">cleared</text>
<text x="0" y="396" font-size="10" fill="#9a9488" letter-spacing="2">THE RECEIPT CHAIN · activity row 202</text>
<text x="132" y="426" font-size="11" fill="#e9e7df" font-weight="700">shipped the export pipeline</text>
<text x="132" y="442" font-size="10" fill="#9a9488">T+17.4 s · cc · tag</text>
<text x="282" y="443" font-size="9" fill="#ff7a4d" text-anchor="middle">SHIPPED</text>
<text x="454" y="420" font-size="9" fill="#9a9488" text-anchor="middle">creates</text>
<text x="585" y="426" font-size="11" fill="#e9e7df" text-anchor="middle" font-weight="700">sync obligation</text>
<text x="585" y="442" font-size="10" fill="#9a9488" text-anchor="middle">reconciled exactly once</text>
<text x="714" y="420" font-size="9" fill="#9a9488" text-anchor="middle">ship</text>
<text x="762" y="426" font-size="11" fill="#e9e7df" font-weight="700">external build log · buildlog/corveth</text>
<text x="762" y="442" font-size="10" fill="#9a9488">T+18.0 s · sync state kept on the row</text>

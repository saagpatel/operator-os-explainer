<text x="340" y="40" font-size="11" fill="#e9e7df" text-anchor="middle" font-weight="700">snapshot</text>
<text x="480" y="24" font-size="10" fill="#9a9488" text-anchor="middle">T+3.0 s</text>
<text x="480" y="40" font-size="11" fill="#e9e7df" text-anchor="middle" font-weight="700">pickup</text>

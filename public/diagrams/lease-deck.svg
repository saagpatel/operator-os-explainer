<text x="0" y="198" font-size="11" fill="#e9e7df" font-weight="700">SPINE</text>
<text x="0" y="212" font-size="10" fill="#9a9488">bridge-db · handoff row</text>
<text x="0" y="318" font-size="11" fill="#e9e7df" font-weight="700">CLAUDE CODE</text>
<text x="0" y="332" font-size="10" fill="#9a9488">claims · has the repo</text>
<text x="208" y="122" font-size="10" fill="#9a9488">create_handoff</text>
<text x="208" y="136" font-size="10" fill="#9a9488">phase implement · PLAN.md</text>
<text x="200" y="204" font-size="10" fill="#e9e7df" text-anchor="middle">pending</text>
<text x="332" y="250" font-size="10" fill="#9a9488" text-anchor="end">reads the latest snapshot</text>
<text x="332" y="264" font-size="10" fill="#9a9488" text-anchor="end">before touching anything</text>
<text x="464" y="250" font-size="10" fill="#9a9488" text-anchor="end">pick_up_handoff</text>
<text x="504" y="236" font-size="10" fill="#ff7a4d">completion capability</text>

<line x1="722" y1="191" x2="900" y2="191" stroke="#1a1c20" stroke-width="1.5" marker-end="url(#guards-arrow-fg)"/>
<line x1="150" y1="207" x2="392" y2="207" stroke="#1a1c20"/>
<line x1="722" y1="207" x2="900" y2="207" stroke="#1a1c20" marker-end="url(#guards-arrow-fg)"/>
<line x1="150" y1="295" x2="392" y2="295" stroke="#1a1c20"/>
<line x1="722" y1="295" x2="900" y2="295" stroke="#1a1c20" marker-end="url(#guards-arrow-fg)"/>
<rect x="400" y="40" width="320" height="30" fill="rgba(26,28,32,0.05)" stroke="rgba(26,28,32,0.22)"/>
<rect x="400" y="88" width="320" height="30" fill="rgba(26,28,32,0.05)" stroke="rgba(26,28,32,0.22)"/>
<rect x="400" y="136" width="320" height="30" fill="rgba(26,28,32,0.05)" stroke="rgba(26,28,32,0.22)"/>
<rect x="400" y="184" width="320" height="30" fill="rgba(26,28,32,0.05)" stroke="#1a1c20"/>
<rect x="400" y="232" width="320" height="30" fill="rgba(26,28,32,0.05)" stroke="rgba(26,28,32,0.22)"/>
<rect x="400" y="280" width="320" height="30" fill="rgba(26,28,32,0.05)" stroke="rgba(26,28,32,0.22)"/>
<rect x="400" y="328" width="320" height="30" fill="rgba(26,28,32,0.05)" stroke="rgba(26,28,32,0.22)"/>
<circle cx="400" cy="103" r="4" fill="#b0451d"/>
<circle cx="400" cy="143" r="4" fill="#b0451d"/>
<circle cx="400" cy="159" r="4" fill="#b0451d"/>
<circle cx="400" cy="191" r="5" fill="#b0451d"/>
<circle cx="400" cy="207" r="4" fill="#b0451d"/>
<circle cx="400" cy="295" r="4" fill="#b0451d"/>
<text x="0" y="22" font-size="10" fill="#6b6457" letter-spacing="2">WOULD-BE ACTION · closed set</text>
<text x="560" y="22" font-size="10" fill="#6b6457" text-anchor="middle" letter-spacing="2">LAYER · outer intent to inner floor</text>
<text x="1120" y="22" font-size="10" fill="#6b6457" text-anchor="end" letter-spacing="2">ADAPTATION · never an escalation</text>
<text x="560" y="59" font-size="11" fill="#1a1c20" text-anchor="middle">1 · permission-mode</text>
<text x="756" y="59" font-size="10" fill="#6b6457">no rule in the map · independent anyway</text>
<text x="560" y="107" font-size="11" fill="#1a1c20" text-anchor="middle">2 · deny-list</text>
<text x="0" y="107" font-size="11" fill="#1a1c20" font-weight="700">credential-read</text>
<text x="908" y="107" font-size="11" fill="#1a1c20">escalated-to-operator</text>
<text x="560" y="155" font-size="11" fill="#1a1c20" text-anchor="middle">3 · pretooluse-hook</text>
<text x="0" y="139" font-size="11" fill="#1a1c20" font-weight="700">non-local-db-write</text>
<text x="908" y="147" font-size="11" fill="#1a1c20">reworded</text>
<text x="0" y="163" font-size="11" fill="#1a1c20" font-weight="700">deep-home-delete</text>
<text x="908" y="163" font-size="11" fill="#1a1c20">rerouted</text>
<text x="560" y="203" font-size="11" fill="#1a1c20" text-anchor="middle" font-weight="700">4 · hard-deny</text>
<text x="0" y="187" font-size="11" fill="#1a1c20" font-weight="700">push-to-main</text>
<text x="0" y="199" font-size="9" fill="#b0451d">replay: T+11.0 s</text>
<text x="386" y="181" font-size="9" fill="#b0451d" text-anchor="end">BLOCKED</text>
<text x="908" y="195" font-size="11" fill="#1a1c20" font-weight="700">opened-a-branch</text>
<text x="0" y="211" font-size="11" fill="#1a1c20" font-weight="700">harness-self-mutate</text>
<text x="908" y="211" font-size="11" fill="#1a1c20">escalated-to-operator</text>
<text x="560" y="251" font-size="11" fill="#1a1c20" text-anchor="middle">5 · confidence-gate</text>
<text x="756" y="251" font-size="10" fill="#6b6457">no rule in the map · independent anyway</text>
<text x="560" y="299" font-size="11" fill="#1a1c20" text-anchor="middle">6 · verify-gate</text>
<text x="0" y="299" font-size="11" fill="#1a1c20" font-weight="700">unverified-complete</text>
<text x="908" y="299" font-size="11" fill="#1a1c20">ran-verify-first</text>
<text x="560" y="347" font-size="11" fill="#1a1c20" text-anchor="middle">7 · integrity-floor</text>
<text x="756" y="343" font-size="10" fill="#6b6457">guards the guards: checks layers 1 to 6</text>
<text x="756" y="357" font-size="10" fill="#6b6457">are present and untampered</text>
<text x="0" y="384" font-size="10" fill="#6b6457">Every entering line stops at one layer;</text>
<text x="0" y="398" font-size="10" fill="#6b6457">nothing passes through to more permission.</text>
<text x="560" y="384" font-size="10" fill="#6b6457">Only push-to-main has a timeline event;</text>
<text x="560" y="398" font-size="10" fill="#6b6457">the other 5 resolve from the static map.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" role="img" aria-label="7 guard layers stacked from outer intent to inner floor: permission-mode, deny-list, pretooluse-hook, hard-deny, confidence-gate, verify-gate, integrity-floor. 6 fabricated would-be actions enter from the left and each stops at the layer that catches it, then exits to the right as an adaptation. No line crosses to a privilege escalation. The integrity floor checks the other 6 are present." font-family="Space Mono, ui-monospace, monospace">
<defs>
<marker id="guards-arrow-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1c20"/></marker>
</defs>
<rect width="1120" height="400" fill="#f4efe4"/>
<line x1="150" y1="103" x2="392" y2="103" stroke="#1a1c20"/>
<line x1="722" y1="103" x2="900" y2="103" stroke="#1a1c20" marker-end="url(#guards-arrow-fg)"/>
<line x1="150" y1="143" x2="392" y2="143" stroke="#1a1c20"/>
<line x1="722" y1="143" x2="900" y2="143" stroke="#1a1c20" marker-end="url(#guards-arrow-fg)"/>
<line x1="150" y1="159" x2="392" y2="159" stroke="#1a1c20"/>
<line x1="722" y1="159" x2="900" y2="159" stroke="#1a1c20" marker-end="url(#guards-arrow-fg)"/>

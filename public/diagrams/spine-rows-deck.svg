<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-label="A horizontal bus labeled bridge-db, SQLite plus FTS5, with 5 taps: activity, handoffs, snapshots, cost, sections. Under each tap, the systems allowed to write it under their fixed caller identity. Below, the retention rule for activity: untagged rows keep only the newest per source, rows tagged SHIPPED or LEDGER are kept for good, and SHIPPED creates a sync obligation. Every row carries a source trust value." font-family="Space Mono, ui-monospace, monospace">
<rect width="1120" height="430" fill="#15191e"/>
<line x1="120" y1="122" x2="120" y2="180" stroke="#e9e7df"/>
<line x1="120" y1="208" x2="120" y2="250" stroke="#2a2f36"/>
<line x1="330" y1="122" x2="330" y2="180" stroke="#e9e7df"/>
<line x1="330" y1="208" x2="330" y2="250" stroke="#2a2f36"/>
<line x1="540" y1="122" x2="540" y2="180" stroke="#e9e7df"/>
<line x1="540" y1="208" x2="540" y2="250" stroke="#2a2f36"/>
<line x1="750" y1="122" x2="750" y2="180" stroke="#e9e7df"/>
<line x1="750" y1="208" x2="750" y2="250" stroke="#2a2f36"/>
<line x1="960" y1="122" x2="960" y2="180" stroke="#e9e7df"/>
<line x1="960" y1="208" x2="960" y2="250" stroke="#2a2f36"/>
<line x1="0" y1="180" x2="1120" y2="180" stroke="#e9e7df" stroke-width="3"/>
<rect x="30" y="60" width="180" height="60" fill="#1b2027" stroke="#2a2f36"/>
<rect x="240" y="60" width="180" height="60" fill="#1b2027" stroke="#2a2f36"/>
<rect x="450" y="60" width="180" height="60" fill="#1b2027" stroke="#2a2f36"/>
<rect x="660" y="60" width="180" height="60" fill="#1b2027" stroke="#2a2f36"/>
<rect x="870" y="60" width="180" height="60" fill="#1b2027" stroke="#2a2f36"/>
<rect x="30" y="316" width="500" height="90" fill="#1b2027" stroke="#2a2f36"/>
<rect x="560" y="316" width="490" height="90" fill="#1b2027" stroke="#2a2f36"/>
<text x="120" y="84" font-size="12" fill="#e9e7df" text-anchor="middle" font-weight="700">activity</text>
<text x="120" y="102" font-size="10" fill="#9a9488" text-anchor="middle">session telemetry, searchable</text>
<text x="120" y="266" font-size="10" fill="#e9e7df" text-anchor="middle">cc · codex · claude_ai</text>
<text x="120" y="280" font-size="10" fill="#e9e7df" text-anchor="middle">notion_os · personal_ops</text>
<text x="330" y="84" font-size="12" fill="#e9e7df" text-anchor="middle" font-weight="700">handoffs</text>
<text x="330" y="102" font-size="10" fill="#9a9488" text-anchor="middle">work moving between systems</text>
<text x="330" y="266" font-size="10" fill="#e9e7df" text-anchor="middle">dispatched by claude_ai only</text>
<text x="330" y="280" font-size="10" fill="#e9e7df" text-anchor="middle">claimed by cc or codex</text>
<text x="540" y="84" font-size="12" fill="#e9e7df" text-anchor="middle" font-weight="700">snapshots</text>
<text x="540" y="102" font-size="10" fill="#9a9488" text-anchor="middle">state saved on completion</text>
<text x="540" y="266" font-size="10" fill="#e9e7df" text-anchor="middle">cc · codex</text>
<text x="540" y="280" font-size="10" fill="#9a9488" text-anchor="middle">read first on takeover</text>
<text x="750" y="84" font-size="12" fill="#e9e7df" text-anchor="middle" font-weight="700">cost</text>
<text x="750" y="102" font-size="10" fill="#9a9488" text-anchor="middle">records and session costs</text>
<text x="750" y="266" font-size="10" fill="#e9e7df" text-anchor="middle">cc · codex</text>
<text x="750" y="280" font-size="10" fill="#e9e7df" text-anchor="middle">notion_os · personal_ops</text>
<text x="960" y="84" font-size="12" fill="#e9e7df" text-anchor="middle" font-weight="700">sections</text>
<text x="960" y="102" font-size="10" fill="#9a9488" text-anchor="middle">long-lived context, stewarded</text>
<text x="960" y="266" font-size="10" fill="#e9e7df" text-anchor="middle">owner claude_ai · cc · codex</text>
<text x="960" y="280" font-size="10" fill="#9a9488" text-anchor="middle">the steward is recorded on read</text>
<text x="0" y="200" font-size="10" fill="#9a9488" letter-spacing="2">BRIDGE-DB · SQLITE + FTS5</text>
<text x="230" y="200" font-size="10" fill="#9a9488" letter-spacing="2">recall searches every row</text>
<text x="0" y="238" font-size="10" fill="#9a9488" letter-spacing="2">WHO MAY WRITE · fixed caller identity</text>
<text x="44" y="336" font-size="10" fill="#9a9488" letter-spacing="2">RETENTION · activity only</text>
<text x="44" y="356" font-size="10" fill="#e9e7df">untagged: only the newest 50 per source</text>
<text x="44" y="374" font-size="10" fill="#ff7a4d" font-weight="700">SHIPPED · LEDGER</text>
<text x="160" y="374" font-size="10" fill="#e9e7df">retained for good, with their receipts</text>
<text x="44" y="392" font-size="10" fill="#e9e7df">SHIPPED alone obliges a build-log sync</text>
<text x="574" y="336" font-size="10" fill="#9a9488" letter-spacing="2">TRUST · every row</text>
<text x="574" y="356" font-size="10" fill="#e9e7df">source_trust: operator · agent · ingested</text>
<text x="574" y="374" font-size="10" fill="#e9e7df">read back as stored data, not instructions</text>
<text x="574" y="392" font-size="10" fill="#e9e7df">every gate decision lands in the audit log</text>
</svg>

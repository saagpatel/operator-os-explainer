name: CI

# Both lineages are covered (see RELEASE.md). On the remote, `main` IS the
# release lineage and `recovery/operator-os-explainer-main-20260719` is the
# dev lineage; they share no merge base by design, so each is triggered by
# name rather than by a shared base branch.
on:
  push:
    branches:
      - main
      - recovery/operator-os-explainer-main-20260719
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'
      - 'codex/**'
      - 'agent/**'
  pull_request:
    branches:
      - main
      - recovery/operator-os-explainer-main-20260719
      - feat/publish-2026-08

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both arms of the declared engines range. 22.22 is the floor: the
        # first release where `node script.ts` type-stripping is unflagged,
        # which package.json's scripts depend on. Node 23 is excluded because
        # vitest 4 and jsdom 29 exclude it.
        node: ['22.22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # The guard scans dist/ only when it is present, so the build must run
      # first or the shipped artifact is never scanned. A stale dist is worse
      # than none: it once produced a false RED from a pre-scrub build.
      - run: pnpm build

      - name: Resolve pinned web release readback contract
        id: web-release-readback
        run: python3 scripts/resolve-web-release-readback-contract.py >> "$GITHUB_OUTPUT"

      - name: Check out pinned web release readback contract
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.web-release-readback.outputs.repository }}
          ref: ${{ steps.web-release-readback.outputs.commit }}
          path: .contract/web-release-readback
          persist-credentials: false

      - name: Verify pinned web release readback contract
        env:
          WEB_RELEASE_READBACK_CONTRACT_ROOT: ${{ github.workspace }}/.contract/web-release-readback
        run: pnpm verify:readback

      - run: pnpm guard

      # The generator is deterministic by contract; a drifted dataset.json
      # means the committed artifact no longer matches its source.
      - name: Verify dataset.json is regenerable byte-for-byte
        run: |
          pnpm generate
          git diff --exit-code -- src/data/dataset.json
